<!DOCTYPE html>

<title>The Ledger — Finance News for SIESCOMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE9DD; --ink:#1E2A38; --rule:#c9c2ab; --brass:#9C7A3C; --brass-bg:#e4d9be;
    --muted:#6b6455;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  header.masthead{border-bottom:3px double var(--ink);padding:34px 0 14px;text-align:center;}
  header.masthead .kicker{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.08em;color:var(--brass);}
  header.masthead h1{font-family:'Newsreader',serif;font-size:2.6rem;margin:6px 0 4px;font-weight:600;}
  header.masthead .dek{font-style:italic;color:var(--muted);font-size:.95rem;margin:0;}

  .layout{display:grid;grid-template-columns:170px 1fr;gap:34px;margin-top:30px;}
  @media (max-width:640px){ .layout{grid-template-columns:1fr;} }

  nav.index{position:sticky;top:20px;align-self:start;font-family:'IBM Plex Mono',monospace;font-size:.8rem;}
  nav.index .label{color:var(--muted);letter-spacing:.05em;margin-bottom:8px;}
  nav.index a{display:block;color:var(--ink);text-decoration:none;padding:5px 0;border-bottom:1px solid var(--rule);}
  nav.index a:hover{color:var(--brass);}
  nav.index .count{color:var(--muted);}

  section.category{margin-bottom:38px;}
  section.category h2{font-family:'Newsreader',serif;font-size:1.3rem;font-weight:600;margin:0 0 4px;border-bottom:2px solid var(--ink);padding-bottom:6px;}

  article.item{padding:16px 0;border-bottom:1px solid var(--rule);}
  article.item:last-child{border-bottom:none;}
  .date{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--brass);}
  article.item h3{font-family:'Newsreader',serif;font-size:1.15rem;margin:4px 0 8px;font-weight:600;line-height:1.3;}
  ul.points{margin:0 0 8px;padding-left:20px;max-width:62ch;}
  ul.points li{font-size:.92rem;line-height:1.5;margin-bottom:4px;}
  article.item a{font-size:.82rem;color:var(--ink);border-bottom:1px solid var(--brass);text-decoration:none;}
  article.item a:hover{color:var(--brass);}

  .empty{font-style:italic;color:var(--muted);padding:20px 0;}
  footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:50px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">

  <div class="layout">
    <nav class="index" id="index"></nav>
    <main id="feed"></main>
  </div>

  <footer>Updated by hand · last entry shown first</footer>
</div>

/* ============================================================ */

function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}

function render(){
  const feed=document.getElementById('feed');
  const index=document.getElementById('index');
  if(!NEWS.length){ feed.innerHTML='<p class="empty">No stories yet. Add your first entry in the NEWS array.</p>'; return; }

  const sorted=[...NEWS].sort((a,b)=> b.date.localeCompare(a.date));
  const byCat={};
  sorted.forEach(n=>{ (byCat[n.category] ||= []).push(n); });

  index.innerHTML='<div class="label">Sections</div>' + Object.keys(byCat).map(cat=>
    `<a href="#${esc(cat).replace(/\s+/g,'-')}">${esc(cat)} <span class="count">(${byCat[cat].length})</span></a>`
  ).join('');

  feed.innerHTML=Object.entries(byCat).map(([cat,items])=>`
    <section class="category" id="${esc(cat).replace(/\s+/g,'-')}">
      <h2>${esc(cat)}</h2>
      ${items.map(n=>`
        <article class="item">
          <div class="date">${fmtDate(n.date)}</div>
          <h3>${esc(n.title)}</h3>
          <ul class="points">
            ${(n.points||[]).map(pt=>`<li>${esc(pt)}</li>`).join('')}
          </ul>
          ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">Read source ↗</a>` : ''}
        </article>
      `).join('')}
    </section>
  `).join('');
}
render();
</script>
</body>
